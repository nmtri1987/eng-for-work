/* NAVIGATION V3 — faithful thin-line SVG icons, geometry and hierarchy from the supplied index.html. */
.side .side-head{padding:7px 9px 12px;margin:9px 1px 4px;letter-spacing:.9px}
.side .nav-tool{flex:0 0 30px;display:grid;place-items:center;padding:0;transition:background .15s,border-color .15s}
.side .nav-tool svg{display:block;width:16px;height:16px}
.side .nav-tool:hover{background:#2b5364;border-color:#6a9a9b}
.side .nav{gap:11px;padding-bottom:8px}
.side .nav-category{border:1px solid #315061;border-radius:13px;box-shadow:0 3px 8px rgba(3,17,25,.07);overflow:hidden}
.side .nav-parent{grid-template-columns:30px minmax(0,1fr) 28px;column-gap:10px;padding:10px;min-height:51px;text-align:left}
.side .nav-parent-label{display:block;min-width:0;overflow-wrap:normal;word-break:normal;line-height:1.33;letter-spacing:.1px}
.side .nav-icon{width:30px;height:30px;min-width:30px;display:grid;place-items:center;border:1px solid #4a6b7a;border-radius:9px;background:#28495c;color:#bce4e8;box-shadow:none}
.side .nav-icon svg{width:17px;height:17px;display:block;flex:none}
.side .nav-category.selected>.nav-parent{background:#22585a;box-shadow:inset 3px 0 #76d6c8}
.side .nav-category.selected>.nav-parent .nav-icon{background:#286768;border-color:#4b9992;color:#dcfff7}
.side .nav-chevron{width:28px;height:28px;min-width:28px;display:grid;place-items:center;border:1px solid #527384;border-radius:9px;background:#224558;color:#dcecef;transform:rotate(0deg);transform-origin:center;transition:transform .18s ease,background .18s ease,border-color .18s ease}
.side .nav-chevron svg{display:block;flex:none;width:16px;height:16px}
.side .nav-category.folded .nav-chevron{transform:rotate(-90deg)}
.side .nav-parent:hover .nav-chevron{background:#315d6e;border-color:#8cb7bd;color:#fff}
.side .nav-kids{padding:8px 8px 11px 13px;gap:2px;background:#142f40}
.side .nav-child{display:grid;grid-template-columns:17px minmax(0,1fr);gap:10px;min-height:36px;padding:7px 9px;border-left:2px solid #3c5869;border-radius:0 8px 8px 0;font-size:12px;font-weight:520;line-height:1.38;color:#c0d2df;overflow-wrap:normal;word-break:normal}
.side .nav-child:hover{background:#234b5e;color:#fff}
.side .nav-child.active{background:#287167;color:#f7fffd;border-left-color:#8ef0d3;font-weight:740}
.side .nav-leaf-icon{color:#8bb9bf;width:17px;height:19px;display:grid;place-items:center;flex:none}
.side .nav-leaf-icon svg{display:block;width:14px;height:14px;stroke-width:1.7}
.side .nav-child.active .nav-leaf-icon{color:#d6fff2}
.side .nav-leaf-label{min-width:0;line-height:1.4}
.side .nav-legend{display:flex;flex-wrap:wrap;column-gap:12px;row-gap:4px;font-size:10.5px;color:#b1ccd2;line-height:1.4}
.side .nav-legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.side .nav-legend i{display:inline-block;width:9px;height:9px;flex:none;border-radius:50%;background:var(--legend)}
.side .nav-foot{padding:12px 13px;margin:12px 0 22px}
.side .nav-foot strong{font-size:10.5px;letter-spacing:.2px;margin:0 0 7px}
.side .nav-parent:focus-visible,.side .nav-child:focus-visible,.side .nav-tool:focus-visible{outline:2px solid #8de8d8;outline-offset:-2px}
@media(prefers-reduced-motion:reduce){.side .nav-chevron{transition:none}}
</style></head><body><div class="backdrop" id="backdrop"></div><div class="shell" id="shell"><aside class="side" id="side"><div class="brand"><div class="brand-label">DEVELOPER KNOWLEDGE BASE</div><div class="brand-title">GIT & ADO<br>HANDBOOK</div><div class="brand-desc">Git commands · commit graphs · workflows<br>Visual guide · Vietnamese</div></div><div class="side-head"><span>QUICK NAVIGATION</span><button type="button" class="nav-tool" id="expandNav" title="Expand / collapse all groups" aria-label="Expand or collapse all navigation groups"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10M7 12h10M7 17h10"/><path d="m4 9-2 3 2 3m16-6 2 3-2 3"/></svg></button></div><nav class="nav" id="nav"></nav><div class="nav-foot"><strong>LEGEND · COMMIT GRAPHS</strong><div class="nav-legend"><span><i style="--legend:#A991DF"></i>Local / feature</span><span><i style="--legend:#75AFE8"></i>Remote / target</span><span><i style="--legend:#75D4B3"></i>Result</span><span><i style="--legend:#F0B56A"></i>Action / index</span></div></div></aside><div class="main"><header class="topbar"><button class="toolbtn mobile-menu" id="mobileMenu" aria-label="Open menu">☰</button><span class="topbar-label">GIT & AZURE DEVOPS · LEARNING LIBRARY</span><label class="searchbox"><span>⌕</span><input id="search" placeholder="Search commands, rebase, stash, worktree..." aria-label="Search all Git commands"><span style="font-size:10px">Ctrl K</span></label><button class="toolbtn" id="resetSearch">Clear</button><button class="toolbtn" id="print" title="Print or save as PDF">⎙</button></header><main class="page" id="page"></main></div></div><div class="toast" id="toast"></div><script type="application/json" id="data">{"commands": [{"id": "git-01", "group": "branch", "cmd": "git branch --list \"[BRANCH_PREFIX]/[BRANCH_NAME]\"", "title": "Tìm branch local theo tên", "purpose": "Chỉ liệt kê local branches khớp pattern; có thể dùng dấu * để tìm theo prefix.", "before": "Local: feature/login, feature/api, main\nBạn chưa rõ branch có tồn tại.", "after": "Output: feature/login\nKhông tạo hoặc chuyển branch.", "example": "git branch --list \"feature/login\"", "note": "Dùng git branch -a để xem cả remote-tracking branches; --list không tự fetch remote.", "effect": "read", "risk": "low"}, {"id": "git-02", "group": "branch", "cmd": "git branch --show-current", "title": "Xem branch đang đứng", "purpose": "Trả về tên branch hiện tại. HEAD detached thì kết quả thường rỗng.", "before": "HEAD → feature/login", "after": "Output: feature/login\nHEAD không thay đổi.", "example": "git branch --show-current", "note": "Trong detached HEAD, dùng git status -sb hoặc git rev-parse HEAD để xem thêm.", "effect": "read", "risk": "low"}, {"id": "git-03", "group": "branch", "cmd": "git checkout [BRANCH]", "title": "Chuyển sang branch có sẵn", "purpose": "Đổi HEAD và cập nhật working tree sang snapshot của branch đích.", "before": "HEAD → main (A-B-C)\nfeature → A-B-D", "after": "HEAD → feature (A-B-D)\nWorking tree phản ánh D.", "example": "git checkout feature/login", "note": "Local changes có nguy cơ bị ghi đè sẽ khiến checkout bị từ chối; không tự xóa changes.", "effect": "worktree", "risk": "medium"}, {"id": "git-04", "group": "branch", "cmd": "git checkout -b [BRANCH]", "title": "Tạo branch và chuyển sang đó", "purpose": "Tạo nhánh tại commit hiện tại, không tạo commit mới.", "before": "main → C\nHEAD → main", "after": "main → C\nfeature/new → C\nHEAD → feature/new", "example": "git checkout -b feature/add-api", "note": "Chỉ là branch local; dùng git push -u origin feature/add-api để publish.", "effect": "refs", "risk": "low"}, {"id": "git-05", "group": "branch", "cmd": "git status", "title": "Xem toàn bộ thay đổi", "purpose": "Cho biết branch, staged, unstaged và untracked files.", "before": "index: app.cs (staged)\nworktree: README.md (modified)\nnew: notes.txt", "after": "Output chia 3 nhóm:\nChanges to be committed\nChanges not staged\nUntracked files", "example": "git status", "note": "Read-only: không thay đổi repository.", "effect": "read", "risk": "low"}, {"id": "git-06", "group": "branch", "cmd": "git status --short", "title": "Status dạng ngắn", "purpose": "Tóm tắt status thành mã XY cho script và kiểm tra nhanh.", "before": "app.cs đã stage\nREADME.md chưa stage\nnotes.txt mới", "after": "M  app.cs\n M README.md\n?? notes.txt", "example": "git status --short", "note": "XY: cột 1=index, cột 2=working tree. ?? là untracked.", "effect": "read", "risk": "low"}, {"id": "git-07", "group": "branch", "cmd": "git status --porcelain=v1 --untracked-files=all", "title": "Status ổn định cho automation", "purpose": "Format porcelain v1 phù hợp parse; liệt kê từng untracked file.", "before": "build/a.json + build/b.json chưa tracked", "after": "?? build/a.json\n?? build/b.json\nKhông thay đổi nội dung.", "example": "git status --porcelain=v1 --untracked-files=all", "note": "Không liệt kê ignored files theo mặc định. Path có thể được quote; cần xử lý đúng nếu parse.", "effect": "read", "risk": "low"}, {"id": "git-08", "group": "branch", "cmd": "git symbolic-ref --short refs/remotes/origin/HEAD", "title": "Xem default branch của remote", "purpose": "Đọc symbolic ref local origin/HEAD (được set khi clone hoặc update).", "before": "origin/HEAD → origin/main", "after": "Output: origin/main\nRef không đổi.", "example": "git symbolic-ref --short refs/remotes/origin/HEAD", "note": "Có thể thiếu hoặc stale; kiểm tra git remote show origin và git remote set-head origin -a khi cần.", "effect": "read", "risk": "low"}, {"id": "git-09", "group": "branch", "cmd": "git remote get-url origin", "title": "Xem URL remote origin", "purpose": "In URL dùng để fetch/push tùy config; lệnh này lấy URL mặc định theo Git config.", "before": "origin → URL chưa biết", "after": "Output: https://dev.azure.com/.../_git/repo\nKhông kết nối hay thay đổi repo.", "example": "git remote get-url origin", "note": "Dùng git remote -v để xem fetch/push URLs; URL không chứng minh quyền truy cập.", "effect": "read", "risk": "low"}, {"id": "git-10", "group": "update", "cmd": "git fetch origin [BRANCH]", "title": "Lấy commit và refs về, chưa merge", "purpose": "Tải objects/refs của branch từ ADO và cập nhật FETCH_HEAD, thường remote-tracking ref theo refspec.", "before": "local main → B\norigin/main → B\nADO main → D", "after": "local main → B (GIỮ NGUYÊN)\norigin/main → D\nWorking tree không đổi.", "example": "git fetch origin main", "note": "Fetch không tự cập nhật files trong working tree. Có thể inspect với git log HEAD..origin/main.", "effect": "refs", "risk": "low"}, {"id": "git-11", "group": "update", "cmd": "git fetch --unshallow", "title": "Đổi shallow clone thành đầy đủ lịch sử", "purpose": "Fetch phần lịch sử bị cắt khỏi shallow repository.", "before": "Repo shallow: ...-C-D\nLịch sử trước C bị thiếu", "after": "Repo non-shallow: A-B-C-D\nFile checkout giữ nguyên.", "example": "git fetch --unshallow", "note": "Chỉ dùng với shallow repo; remote phải cung cấp phần history cần thiết. Kiểm tra bằng rev-parse --is-shallow-repository.", "effect": "objects", "risk": "medium"}, {"id": "git-12", "group": "update", "cmd": "git pull origin [BRANCH]", "title": "Fetch rồi tích hợp vào branch hiện tại", "purpose": "Thực hiện fetch và merge/rebase theo cấu hình; không đảm bảo luôn là fast-forward.", "before": "local main → B\nADO main → D", "after": "Nếu FF: main → D\nNếu divergent: merge/rebase hoặc báo lỗi tùy cấu hình.", "example": "git pull origin main", "note": "Local changes có thể làm pull bị chặn; nên kiểm tra git status và pull.rebase/ff config.", "effect": "history", "risk": "medium"}, {"id": "git-13", "group": "update", "cmd": "git pull --ff-only origin <default-branch>", "title": "Chỉ cập nhật nếu fast-forward được", "purpose": "Nếu HEAD local là ancestor của remote, di chuyển branch pointer lên commit mới, không có merge commit.", "before": "local main → B\norigin/main → D\nA—B—C—D", "after": "local main → D\nA—B—C—D\nKhông tạo commit M.", "example": "git pull --ff-only origin main", "note": "Branch đã diverge sẽ fail. Uncommitted changes nếu bị đè cũng làm pull fail; chúng không được merge tự động.", "effect": "history", "risk": "medium"}, {"id": "git-14", "group": "update", "cmd": "git merge --no-edit \"origin/[BRANCH]\"", "title": "Merge remote-tracking branch vào HEAD", "purpose": "Kết hợp history của origin/branch với branch hiện tại; -no-edit dùng message mặc định nếu tạo merge commit.", "before": "main → T2\nfeature → F2\n       ↗ T1—T2\nA—B\n       ↘ F1—F2", "after": "main → M (cha: T2, F2)\nCó thể chỉ FF nếu không diverge.", "example": "git merge --no-edit \"origin/main\"", "note": "Conflict vẫn có thể xảy ra. --no-edit KHÔNG bỏ qua conflict/review; chỉ không mở editor message.", "effect": "history", "risk": "high"}, {"id": "git-15", "group": "update", "cmd": "git merge --abort", "title": "Hủy merge đang thực hiện", "purpose": "Quay lại trạng thái trước merge nếu có MERGE_HEAD và thao tác khôi phục được.", "before": "Merge đang conflict\nMERGE_HEAD tồn tại\nFiles có conflict markers", "after": "Merge dừng\nHEAD trở lại pre-merge\nCác thay đổi trước merge thường được giữ.", "example": "git merge --abort", "note": "Có thể không khôi phục sạch nếu bạn đã sửa files trước/trong merge; tránh chạy khi không hiểu trạng thái.", "effect": "worktree", "risk": "medium"}, {"id": "git-16", "group": "update", "cmd": "git stash push --include-untracked -m \"...\"", "title": "Cất tạm tracked + untracked changes", "purpose": "Lưu thay đổi index/working tree và untracked vào stash, sau đó dọn về HEAD; ignored files không được cất.", "before": "HEAD → C\nmodified: app.cs\nuntracked: note.md", "after": "HEAD → C\nStash: WIP snapshot\nWorking tree sạch (với files được stash).", "example": "git stash push --include-untracked -m \"WIP before pull\"", "note": "-u = --include-untracked. Ignored files cần -a; không dùng -a tùy tiện vì có thể chứa build output.", "effect": "worktree", "risk": "medium"}, {"id": "git-17", "group": "update", "cmd": "git stash apply <stash-sha>", "title": "Áp dụng stash, không xóa stash", "purpose": "Đưa thay đổi từ stash commit trở lại working tree/index tùy cách apply; không auto-drop.", "before": "HEAD → D\nStash S có edits từ C\nWorking tree sạch", "after": "Working tree nhận edits từ S\nStash S vẫn còn.", "example": "git stash apply stash@{0}", "note": "Có thể conflict. Với SHA commit của stash, truyền hash hợp lệ; stash@{0} là selector dễ dùng.", "effect": "worktree", "risk": "medium"}, {"id": "git-18", "group": "update", "cmd": "git stash list", "title": "Xem các stash", "purpose": "Liệt kê stash entries theo thứ tự mới nhất trước.", "before": "stash@{0}: WIP deploy\nstash@{1}: WIP before pull", "after": "Output 2 entries\nKhông thay đổi stash.", "example": "git stash list", "note": "Để xem hash: git rev-parse stash@{0}. Để xem thay đổi: git stash show -p stash@{0}.", "effect": "read", "risk": "low"}, {"id": "git-19", "group": "update", "cmd": "git stash drop <selector>", "title": "Xóa tham chiếu một stash entry", "purpose": "Bỏ entry khỏi stash list; việc khôi phục sau đó không nên coi là đảm bảo.", "before": "stash@{0}: WIP A\nstash@{1}: WIP B", "after": "stash@{0}: WIP B\nWIP A bị drop khỏi stash list.", "example": "git stash drop stash@{0}", "note": "Dùng selector như stash@{0}, không dùng raw SHA cho drop. Trong PowerShell có thể quote selector.", "effect": "refs", "risk": "high"}, {"id": "git-20", "group": "stage", "cmd": "git add -A", "title": "Stage toàn bộ thay đổi", "purpose": "Đưa additions, modifications và deletions trong repo vào index.", "before": "WT: +a.cs, ~b.cs, -c.cs\nIndex: trống", "after": "Index: +a.cs, ~b.cs, -c.cs\nHEAD chưa đổi.", "example": "git add -A", "note": "Kiểm tra git diff --cached trước commit; chú ý không stage nhầm secret/build files.", "effect": "index", "risk": "medium"}, {"id": "git-21", "group": "stage", "cmd": "git add -- <path>", "title": "Stage file hoặc đường dẫn cụ thể", "purpose": "-- kết thúc option parsing, hữu ích cho path bắt đầu bằng dấu - hoặc chứa ký tự đặc biệt.", "before": "WT: ~src/api.cs, ~README.md\nIndex: trống", "after": "Index: ~src/api.cs\nREADME.md vẫn unstaged.", "example": "git add -- src/api.cs", "note": "Với file chứa spaces, quote path: git add -- \"src/my file.cs\".", "effect": "index", "risk": "low"}, {"id": "git-22", "group": "stage", "cmd": "git commit -m \"...\"", "title": "Tạo commit từ index", "purpose": "Tạo commit mới chứa staged snapshot; unstaged edits không được commit.", "before": "HEAD → C\nIndex: app.cs (staged)", "after": "HEAD → D (parent C)\nCommit D chứa app.cs\nUnstaged changes vẫn ở WT.", "example": "git commit -m \"Fix API timeout\"", "note": "Commit không tự push lên ADO. Nếu không có gì staged, commit thường thất bại.", "effect": "history", "risk": "medium"}, {"id": "git-23", "group": "stage", "cmd": "git push", "title": "Đẩy commits lên remote tracking branch", "purpose": "Push commit và cập nhật remote ref theo upstream/push.default.", "before": "local feature → D\norigin/feature → B", "after": "origin/feature → D (nếu được phép)\nADO nhận các commit mới.", "example": "git push", "note": "Nếu remote có commits mới không nằm trong local, non-force push thường bị reject.", "effect": "remote", "risk": "high"}, {"id": "git-24", "group": "stage", "cmd": "git push --set-upstream origin <branch-name>", "title": "Publish branch và set upstream", "purpose": "Push branch và cấu hình upstream để git push/pull sau này biết branch tương ứng.", "before": "local feature/new → D\nADO chưa có feature/new", "after": "ADO feature/new → D\nlocal branch track origin/feature/new", "example": "git push --set-upstream origin feature/new", "note": "-u = --set-upstream. Không tạo PR tự động.", "effect": "remote", "risk": "medium"}, {"id": "git-25", "group": "inspect", "cmd": "git diff origin/<BRANCH>...HEAD", "title": "Diff từ merge-base đến HEAD", "purpose": "Dùng merge-base(origin/branch, HEAD) làm base, so với HEAD; hữu ích review những commits của feature so với target.", "before": "common B\ntarget B—T1—T2\nfeature B—F1—F2", "after": "Diff(B, F2)\nHiển thị thay đổi commit của feature\nKhông sửa repo.", "example": "git diff origin/main...HEAD", "note": "Dấu ... trong git diff khác git log A...B. Lệnh này không bao gồm unstaged/staged chưa commit.", "effect": "read", "risk": "low"}, {"id": "git-26", "group": "inspect", "cmd": "git diff --name-only origin/<BRANCH>...HEAD", "title": "Chỉ tên file changed trong feature", "purpose": "Cùng phạm vi ba chấm, output rút gọn thành đường dẫn.", "before": "Diff(B, F2): app.cs, test.cs", "after": "app.cs\ntest.cs\nKhông in nội dung diff.", "example": "git diff --name-only origin/main...HEAD", "note": "Rất tiện lập file list cho AI agent / PR analysis. Nếu cần phát hiện rename, thêm -M.", "effect": "read", "risk": "low"}, {"id": "git-27", "group": "inspect", "cmd": "git diff -U0 origin/<BRANCH>", "title": "Patch so với remote branch, 0 dòng context", "purpose": "So working tree hiện tại với origin/branch; -U0 chỉ giữ các dòng bị đổi trong patch.", "before": "origin/main: x = 1\nWT hiện tại: x = 2", "after": "@@ -10 +10 @@\n-x = 1\n+x = 2", "example": "git diff -U0 origin/main", "note": "Đây không phải cú pháp ...HEAD: so với working tree, bao gồm thay đổi chưa commit. Một số tools cần context để hiểu patch.", "effect": "read", "risk": "low"}, {"id": "git-28", "group": "inspect", "cmd": "git diff --name-only -M <previous_head> HEAD", "title": "Tìm file changed giữa hai commits", "purpose": "Liệt kê filenames; -M bật rename detection (heuristic), thường hiển thị path mới.", "before": "C: old.cs\nD: renamed new.cs", "after": "Output: new.cs\nRename được phát hiện nếu đủ tương đồng.", "example": "git diff --name-only -M HEAD~1 HEAD", "note": "Chỉ tên file, không thể hiện rename score; dùng git diff --name-status -M để thấy Rxxx.", "effect": "read", "risk": "low"}, {"id": "git-29", "group": "inspect", "cmd": "git diff --cached --name-only", "title": "Xem tên file đã stage", "purpose": "So index với HEAD, chỉ in filenames.", "before": "HEAD: app.cs cũ\nIndex: app.cs mới, test.cs mới", "after": "app.cs\ntest.cs", "example": "git diff --cached --name-only", "note": "--cached = --staged. Không tính những edits chưa git add.", "effect": "read", "risk": "low"}, {"id": "git-30", "group": "inspect", "cmd": "git ls-files --others --exclude-standard", "title": "Liệt kê untracked, không tính ignored", "purpose": "Chỉ liệt kê files không được Git track và không bị ignore bởi standard excludes.", "before": "tracked: app.cs\nuntracked: note.md\nignored: bin/output.dll", "after": "Output: note.md\nKhông liệt kê bin/output.dll.", "example": "git ls-files --others --exclude-standard", "note": "Phù hợp scan file mới; không tương đương git status vì không cho biết tracked modified files.", "effect": "read", "risk": "low"}, {"id": "git-31", "group": "inspect", "cmd": "git show <branch>:<file>", "title": "Đọc file tại một revision", "purpose": "In nội dung file trong tree của branch/commit, không cần checkout.", "before": "main:config.json = v1\nfeature:config.json = v2", "after": "Output: config.json phiên bản main\nWorking tree vẫn giữ v2.", "example": "git show main:src/config.json", "note": "Path trong cú pháp này tương đối với repository root (không phải tùy ý current folder).", "effect": "read", "risk": "low"}, {"id": "git-32", "group": "inspect", "cmd": "git rev-parse HEAD", "title": "Lấy SHA commit hiện tại", "purpose": "Resolve HEAD ra object ID commit; thường dùng để trace pipeline build/release.", "before": "HEAD → feature → C", "after": "Output: 40/64-hex object ID của C\nKhông thay đổi state.", "example": "git rev-parse HEAD", "note": "SHA-1 thường 40 ký tự; repo SHA-256 có độ dài khác. Có thể dùng --short HEAD.", "effect": "read", "risk": "low"}, {"id": "git-33", "group": "inspect", "cmd": "git rev-parse origin/<BRANCH>", "title": "Lấy SHA remote-tracking branch", "purpose": "Đọc commit ID của local cache origin/branch (cập nhật sau fetch).", "before": "origin/main(local) → B\nADO main → D", "after": "Output: SHA của B\nFetch trước nếu cần SHA mới nhất của ADO.", "example": "git fetch origin main && git rev-parse origin/main", "note": "Remote-tracking ref là local cached state, không phải query live mỗi lần rev-parse.", "effect": "read", "risk": "low"}, {"id": "git-34", "group": "inspect", "cmd": "git rev-parse --is-shallow-repository", "title": "Kiểm tra shallow clone", "purpose": "In true nếu commit history bị shallow boundary.", "before": "Repo chỉ có lịch sử C—D", "after": "Output: true\nRepo không đổi.", "example": "git rev-parse --is-shallow-repository", "note": "Nếu true và cần historical rename/log đầy đủ: git fetch --unshallow.", "effect": "read", "risk": "low"}, {"id": "git-35", "group": "inspect", "cmd": "git rev-parse --show-toplevel", "title": "Tìm root working tree", "purpose": "In đường dẫn tuyệt đối tới root của working tree hiện tại.", "before": "cwd: repo/src/api/", "after": "Output: /work/repo\nKhông đổi folder.", "example": "git rev-parse --show-toplevel", "note": "Trong bare repo không có working tree, lệnh thường báo lỗi.", "effect": "read", "risk": "low"}, {"id": "git-36", "group": "inspect", "cmd": "git rev-parse --git-common-dir", "title": "Tìm vùng Git metadata dùng chung", "purpose": "Cho biết git common dir; rất hữu ích với linked worktrees chia sẻ objects và refs.", "before": "main: repo/.git\nworktree: ../wt/.git (pointer)", "after": "Output từ linked WT: /work/repo/.git (hoặc path tương đối)\nHEAD/index vẫn riêng.", "example": "git rev-parse --git-common-dir", "note": "Giá trị có thể là relative path; -git-dir và -git-common-dir khác nhau trong worktree.", "effect": "read", "risk": "low"}, {"id": "git-37", "group": "inspect", "cmd": "git merge-base --is-ancestor <merge-commit> <sourceVersion>", "title": "Kiểm tra commit có nằm trong ancestry", "purpose": "Không in kết quả; exit 0 nếu commit thứ nhất là ancestor (hoặc bằng) commit thứ hai.", "before": "A—B—C—D\nHỏi: B có là ancestor của D?", "after": "exit code 0: Đúng\nexit code 1: Không\nLỗi khác: invalid refs/khác.", "example": "git merge-base --is-ancestor B D", "note": "Không dùng text output để kiểm tra. Shell: if git merge-base --is-ancestor A B; then ...; fi. Cần đủ history để kết luận.", "effect": "read", "risk": "low"}, {"id": "git-38", "group": "inspect", "cmd": "git log --diff-filter=A --follow --format=%cs -1 <file>", "title": "Tìm ngày file được thêm vào Git", "purpose": "Lọc commits có trạng thái Added, theo tên file qua rename, trả về ngày commit ở format YYYY-MM-DD.", "before": "file renamed: old.cs → api.cs\nGit history có commit Add cũ", "after": "Output ví dụ: 2024-08-21\nKhông thay đổi repo.", "example": "git log --diff-filter=A --follow --format=%cs -1 -- src/api.cs", "note": "%cs là committer date, không nhất thiết ngày file được tạo trên máy. Shallow history có thể làm sai lệch kết quả.", "effect": "read", "risk": "low"}, {"id": "git-39", "group": "utility", "cmd": "git clone --bare --filter=blob:none <remote_url>", "title": "Clone Git database không checkout files", "purpose": "Tạo bare repo: refs/objects/config nằm ở repo dir; partial clone cố gắng chưa tải blob contents.", "before": "Remote: commits + trees + blobs\nChưa có local repo", "after": "Local bare.git/: HEAD, objects, refs, config\nKhông có src/ để edit files.", "example": "git clone --bare --filter=blob:none https://example/repo.git", "note": "Bare repo thường không tạo origin/* remote-tracking refs theo cách clone thông thường. Filtering phải được server hỗ trợ.", "effect": "filesystem", "risk": "medium"}, {"id": "git-40", "group": "utility", "cmd": "git clone --quiet --bare --filter=blob:none <remote> <cache>", "title": "Clone bare cache, giảm log tiến trình", "purpose": "Giống bare partial clone, chỉ định directory cache, và --quiet giảm progress messages.", "before": "Remote repo tồn tại\n/cache/git-cache chưa có", "after": "cache/ là bare Git directory\nTerminal ít output hơn\nKhông có working tree.", "example": "git clone --quiet --bare --filter=blob:none \"$REMOTE\" \"$CACHE\"", "note": "--quiet không có nghĩa ẩn lỗi. Có thể dùng cache bare + git worktree add để phân tích nhiều revisions.", "effect": "filesystem", "risk": "medium"}, {"id": "git-41", "group": "utility", "cmd": "git worktree add --detach <path> [commit-ish]", "title": "Tạo working tree riêng, detached HEAD", "purpose": "Tạo folder checkout tại commit chỉ định, dùng chung object store/refs với repo chính nhưng HEAD/index/worktree riêng.", "before": "repo/ (main @ D)\nChưa có ../review-pr", "after": "repo/ (main @ D)\n../review-pr/ (detached @ F2)\n2 working directories.", "example": "git worktree add --detach ../review-pr origin/feature/login", "note": "Phải có <path>. Detached HEAD không gắn branch; commit mới có thể bị mất tham chiếu nếu không tạo branch/tag.", "effect": "filesystem", "risk": "medium"}, {"id": "git-42", "group": "utility", "cmd": "git worktree remove --force <path>", "title": "Xóa linked worktree kể cả dirty", "purpose": "Deregister worktree và xóa folder; --force cho phép xóa khi có tracked/untracked changes.", "before": "repo/ + ../review-pr/\nreview-pr có sửa file chưa commit", "after": "Chỉ còn repo/\n../review-pr bị xóa", "example": "git worktree remove --force ../review-pr", "note": "CẢNH BÁO: --force có thể làm mất uncommitted/untracked files. Không xóa main worktree. Với locked worktree có thể cần 2 lần --force.", "effect": "filesystem", "risk": "high"}, {"id": "git-43", "group": "utility", "cmd": "git hash-object --stdin", "title": "Tính object ID từ stdin", "purpose": "Tính hash của nội dung theo Git blob format; mặc định KHÔNG ghi object vào database.", "before": "Input stdin: hello + newline\nChưa có blob object lưu", "after": "Output: SHA của blob content\nRepo không đổi (không có -w).", "example": "printf \"hello\\n\" | git hash-object --stdin", "note": "PowerShell pipeline có thể dùng encoding/newline khác; hash thay đổi theo bytes chính xác. Thêm -w mới ghi blob.", "effect": "read", "risk": "low"}, {"id": "git-44", "group": "utility", "cmd": "git config --get \"branch.$(git branch --show-current).gh-merge-base\"", "title": "Đọc cấu hình base branch của gh CLI", "purpose": "Kiểm tra key branch.<current>.gh-merge-base nếu tồn tại; không phải Git core merge-base algorithm.", "before": "branch feature/login\nconfig có gh-merge-base=develop", "after": "Output: develop\nKhông thay đổi config.", "example": "git config --get \"branch.$(git branch --show-current).gh-merge-base\"", "note": "Key là cấu hình do GitHub CLI/automation có thể đặt; không chứng minh ADO PR target. Nếu key không có, exit 1.", "effect": "read", "risk": "low"}, {"id": "git-45", "group": "utility", "cmd": "git mv <old-path> <new-path>", "title": "Đổi tên hoặc di chuyển tracked file", "purpose": "Thực hiện filesystem rename/move và stage thay đổi tương ứng. Git không lưu “rename operation” như object riêng: rename được nhận diện khi diff.", "before": "src/OldName.cs (tracked)\nIndex: OldName.cs", "after": "src/NewName.cs tồn tại\nIndex: delete OldName.cs + add NewName.cs\nDiff có thể hiển thị rename.", "example": "git mv src/OldName.cs src/NewName.cs", "note": "Không tạo commit; cần git commit. Nếu file có unstaged edits, hãy kiểm tra status trước khi mv.", "effect": "index", "risk": "medium"}], "groups": [{"id": "merge", "label": "Merge strategies", "sub": "ADO PR completion", "icon": "git-merge"}, {"id": "branch", "label": "Nhánh và trạng thái", "sub": "Branch · status · remote", "icon": "git-branch"}, {"id": "update", "label": "Update · merge · stash", "sub": "Fetch · pull · merge · stash", "icon": "refresh-cw"}, {"id": "stage", "label": "Stage · commit · push", "sub": "Index · history · remote", "icon": "upload-cloud"}, {"id": "inspect", "label": "Diff · revision · file", "sub": "Inspect & compare", "icon": "scan-e function header(title,desc){return `<div class="command-intro"><div><span class="eyebrow">INTERACTIVE VISUAL GUIDE</span><h1>${esc(title)}</h1><p>${esc(desc)}</p></div></div>`}
function hero(title,desc){return `<section class="hero"><div class="hero-symbol"><svg width="48" height="48" viewBox="0 0 64 64" fill="none"><path d="M17 15v30M17 30h30M47 30v17" stroke="#2c405f" stroke-width="3" stroke-linecap="round"/><circle cx="17" cy="15" r="7" fill="#A9DEC4" stroke="#2c405f" stroke-width="2"/><circle cx="17" cy="45" r="7" fill="#F9DA77" stroke="#2c405f" stroke-width="2"/><circle cx="47" cy="30" r="7" fill="#A9D8F0" stroke="#2c405f" stroke-width="2"/><circle cx="47" cy="47" r="7" fill="#F5B6AF" stroke="#2c405f" stroke-width="2"/></svg></div><div><span class="eyebrow">GIT VISUAL HANDBOOK · AZURE DEVOPS</span><h1>${esc(title)}</h1><p>${esc(desc)}</p><div class="hero-actions"><button data-view="merge" class="smallbtn primary">4 merge strategies →</button><button data-view="group-update" class="smallbtn">Fetch · Pull · Stash</button><button data-view="workflow" class="smallbtn">See Git workflow</button></div></div></section>`}
function row(x,y,c1,c2,label1,label2){return `<line x1="${x}" y1="${y}" x2="${c1}" y2="${c2}" stroke="#92A8C2" stroke-width="3" stroke-linecap="round"/><text x="${x}" y="${y-12}" font-size="10" fill="#516B8A">${esc(label1||'')}</text>`}
function node(x,y,t,color=tones.blue,r=17){return `<circle cx="${x}" cy="${y}" r="${r}" fill="${color}" stroke="#2C405F" stroke-width="1.25"/><text x="${x}" y="${y+4}" font-size="11" font-weight="800" fill="#172B42" text-anchor="middle">${esc(t)}</text>`}
function text(x,y,v,color='#506783',size=11,anchor='middle'){return `<text x="${x}" y="${y}" font-family="Consolas,monospace" font-size="${size}" fill="${color}" text-anchor="${anchor}">${esc(v)}</text>`}
function rect(x,y,w,h,t,fill='#E9F1FA',color='#2C405F'){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="9" fill="${fill}" stroke="#C5D6E7"/><text x="${x+w/2}" y="${y+h/2+4}" fill="${color}" font-size="11" font-weight="750" text-anchor="middle">${esc(t)}</text>`}
function arrow(x1,y1,x2,y2,col='#87A4C0',dashed=false){return `<path d="M${x1} ${y1}L${x2} ${y2}" fill="none" stroke="${col}" stroke-width="2.3" ${dashed?'stroke-dasharray="5 5"':''}/><path d="M${x2-6} ${y2-5}L${x2} ${y2}L${x2-6} ${y2+5}" fill="none" stroke="${col}" stroke-width="2"/>`}
function svg(content,alt='Git visual graph'){return `<svg viewBox="0 0 480 190" role="img" aria-label="${esc(alt)}" preserveAspectRatio="xMidYMid meet">${content}</svg>`}
function history(phase,mode){let n=[node(40,94,'A',tones.slate),node(125,94,'B',tones.slate),node(222,94,'C',tones.blue),node(325,94,'D',tones.blue)];let e=`<path d="M40 94H325" stroke="#8399B3" stroke-width="3"/>`;let notes='';
if(mode==='fetch'){ if(phase==='before'){n=[node(40,94,'A',tones.slate),node(125,94,'B',tones.purple),node(222,94,'C',tones.blue),node(325,94,'D',tones.blue)];notes=text(125,60,'local / origin', '#8966B1',12)+text(326,60,'ADO main','#416FA9',12)}else{notes=text(125,57,'local main','#8966B1',12)+text(325,57,'origin/main','#31866D',12)+text(237,152,'Working tree unchanged','#5F7692',11)} }
else if(mode==='ff'){if(phase==='before'){n=[node(40,94,'A',tones.mint),node(125,94,'B',tones.mint),node(222,94,'C',tones.blue),node(325,94,'D',tones.blue)];notes=text(125,57,'local main','#31866D',12)+text(325,57,'ADO main','#416FA9',12)}else {n=[node(40,94,'A',tones.mint),node(125,94,'B',tones.mint),node(222,94,'C',tones.mint),node(325,94,'D',tones.mint)];notes=text(325,57,'local + ADO','#31866D',12)+text(240,152,'No merge commit','#5F7692',11)}}
else if(mode==='push'){if(phase==='before'){n=[node(40,94,'A',tones.slate),node(125,94,'B',tones.blue),node(222,94,'C',tones.purple),node(325,94,'D',tones.purple)];notes=text(125,57,'origin/main','#416FA9',12)+text(325,57,'local main','#8966B1',12)}else{n=[node(40,94,'A',tones.mint),node(125,94,'B',tones.mint),node(222,94,'C',tones.mint),node(325,94,'D',tones.mint)];notes=text(325,57,'origin/main + local','#31866D',12)}}
else if(mode==='commit'){if(phase==='before'){n=[node(40,94,'A',tones.slate),node(125,94,'B',tones.slate),node(222,94,'C',tones.purple)];e=`<path d="M40 94H222" stroke="#8399B3" stroke-width="3"/>`;notes=text(222,57,'HEAD','#8966B1',12)+rect(305,70,138,45,'Staged changes','#FFF1D8','#9C6D30');}else{n=[node(40,94,'A',tones.slate),node(125,94,'B',tones.slate),node(222,94,'C',tones.slate),node(325,94,'E',tones.mint)];notes=text(325,57,'HEAD / new commit','#31866D',11)}}
return svg(e+n.join('')+notes,mode+' '+phase)}
function branchGraph(phase,kind){let a=`<path d="M40 102H205" stroke="#8399B3" stroke-width="3"/>${node(40,102,'A',tones.slate)}${node(125,102,'B',tones.slate)}${node(205,102,'C',tones.blue)}`;let b=`<path d="M205 102L315 48" stroke="#95A8BC" stroke-width="2.7"/>${node(315,48,'D',tones.purple)}`;
if(kind==='switch')return svg(a+b+text(205,138,'main',phase==='before'?'#34816F':'#6882A2')+text(315,25,'feature',phase==='after'?'#34816F':'#6882A2')+text(242,175,phase==='before'?'HEAD → main':'HEAD → feature',phase==='before'?'#8966B1':'#31866D',13));
return svg(a+text(205,55,'main → C','#4B709B',12)+text(205,139,phase==='before'?'HEAD → main':'HEAD → feature/new',phase==='before'?'#8966B1':'#31866D',12)+(phase==='after'?rect(280,77,175,49,'feature/new → C','#E4F7EF','#287A60'):'') )}
function diverge(phase,mode){let s=`<path d="M42 95H115L218 45H326" stroke="#8DA5BC" stroke-width="3" fill="none"/><path d="M115 95L218 148H326" stroke="#8DA5BC" stroke-width="3" fill="none"/>${node(42,95,'A',tones.slate)}${node(115,95,'B',tones.slate)}${node(218,45,'C',tones.blue)}${node(326,45,'D',tones.blue)}${node(218,148,'F1',tones.purple)}${node(326,148,'F2',tones.purple)}${text(412,45,'main','#406D9E')}${text(412,148,'feature','#8966B1')}`;
if(phase==='before')return svg(s,'diverged branches');
if(mode==='merge')return svg(s+`<path d="M326 45L416 95L326 148" stroke="#6DBA9C" stroke-width="3" fill="none"/>${node(416,95,'M',tones.mint)}`);
if(mode==='abort')return svg(s+rect(368,81,89,28,'CANCELLED','#FCEBDD','#995B44'));
return svg(s)}
function flowGraph(phase,mode,command){let before=phase==='before';let a='',info=''; const bg='#F3F8FC';
const box=(x,y,w,t,fill='#EDF3FA')=>rect(x,y,w,47,t,fill);
if(mode==='stage'){a=box(23,65,116,'Working tree',before?'#FBE6C8':'#E7F5EF')+box(182,65,116,'Index / stage',before?'#EDF3FA':'#E4F7EF')+box(341,65,116,'HEAD commit');a+=arrow(140,88,179,88,before?'#9EABB9':'#399E83');info=text(239,43,before?'modified app.cs':'app.cs staged',before?'#AC7945':'#2E896B',13)}
else if(mode==='stash'){a=box(23,65,115,'Working tree',before?'#FCE6D4':'#EFF6FC')+box(181,65,117,'Stash stack',before?'#EDF3FA':'#DCF5EB')+box(341,65,116,'HEAD');a+=arrow(before?140:300,88,before?177:344,88,before?'#E5AB61':'#76C6A9');info=text(241,45,before?'modified + untracked':mode==='stash'?'saved WIP at stash@{0}':'restored changes',before?'#AA7846':'#2D856F',11)}
else if(mode==='stashapply'){a=box(23,65,115,'Stash entry', '#EFE9FA')+box(182,65,117,'Working tree',before?'#F0F5FA':'#E4F7EF')+box(341,65,116,'Stash retained','#E8EDF6');a+=arrow(140,88,179,88);info=text(245,45,before?'saved WIP':'changes restored',before?'#886B9D':'#28846C',12)}
else if(mode==='stashdrop'){a=box(23,65,116,before?'stash@{0}':'stash@{1}',before?'#E9E4F7':'#F3F6FA')+box(182,65,116,before?'stash@{1}':'(removed)')+box(341,65,116,'Working tree');info=text(242,42,before?'2 stash entries':'1 stash entry; WT unchanged',before?'#9863A3':'#2B846B',12)}
else if(mode==='clone'){a=box(23,65,116,'ADO remote','#E8F0FE')+box(181,65,117,before?'not cloned':'Bare object store',before?'#F1F3F7':'#E3F7EE')+box(341,65,116,'Working tree', '#F5F7F9');a+=arrow(140,88,179,88);info=text(241,43,before?'No local cache':'No checkout (bare)',before?'#846FB3':'#24866E',12)}
else if(mode==='worktree'){a=box(23,65,115,'Shared .git', '#E7E6F8')+box(181,65,117,'Main worktree','#E8F0FB')+box(341,65,116,before?'Not attached':'Review worktree',before?'#F3F6F8':'#E0F5EA');a+=arrow(140,88,179,88)+arrow(299,88,338,88,'#7BA3C2',true);info=text(245,43,before?'one working folder':'two working folders',before?'#866AB6':'#2C886F',12)}
else if(mode==='remove-worktree'){a=box(23,65,115,'Shared .git','#EBE6F9')+box(181,65,117,'Main worktree','#E8F0FB')+box(341,65,116,before?'Review worktree':'Removed',before?'#FFEBD2':'#F1F5F7');info=text(242,43,before?'both directories':'main remains',before?'#956BB2':'#2A846D',12)}
else if(mode==='move'){a=box(23,65,115,before?'old/path.cs':'old path gone','#EAF1F8')+box(182,65,117,'Index', before?'#F1F5FA':'#E6F7EB')+box(341,65,116,before?'new path absent':'new/path.cs',before?'#F2F4F7':'#E4F7EB');a+=arrow(141,88,179,88)+arrow(300,88,339,88);info=text(242,43,before?'Tracked file at old path':'Rename staged',before?'#956BA6':'#2A856F',12)}
else if(mode==='hash'){a=box(23,65,115,'stdin data','#FFF0D7')+box(181,65,117,'Hash function','#E8F0FB')+box(341,65,116,before?'not calculated':'Object ID','#E4F7ED');a+=arrow(141,88,179,88)+arrow(300,88,339,88);info=text(245,43,before?'input bytes':'hash printed; no write by default',before?'#946A37':'#29856C',11)}
else {a=box(21,65,115,'Repository','#E7EEF9')+box(181,65,117,'Git command',before?'#EDE8F9':'#E7F0FB')+box(341,65,117,before?'Output pending':'Read result',before?'#F2F5F9':'#DFF4EA');a+=arrow(138,88,179,88)+arrow(300,88,339,88);info=text(242,43,before?'Read-only inspection':'Refs/files unchanged',before?'#866AB6':'#2A856F',12)}
return svg(a+info,esc(command+' '+phase))}
function visual(c,phase){const id=Number(c.id.split('-')[1]);if([10,13,23,24,22].includes(id))return history(phase,({10:'fetch',13:'ff',22:'commit',23:'push',24:'push'})[id]);
if([3,4].includes(id))return branchGraph(phase,id===3?'switch':'create');
if([12,14,15].includes(id))return diverge(phase,id===15?'abort':'merge');
if(id===11)return history(phase,'fetch');
if([20,21].includes(id))return flowGraph(phase,'stage',c.cmd);
if(id===16)return flowGraph(phase,'stash',c.cmd);
if(id===17)return flowGraph(phase,'stashapply',c.cmd);
if(id===19)return flowGraph(phase,'stashdrop',c.cmd);
if([39,40].includes(id))return flowGraph(phase,'clone',c.cmd);
if(id===41)return flowGraph(phase,'worktree',c.cmd);
if(id===42)return flowGraph(phase,'remove-worktree',c.cmd);
if(id===43)return flowGraph(phase,'hash',c.cmd);
if(id===45)return flowGraph(phase,'move',c.cmd);
return flowGraph(phase,'read',c.cmd)}
function diagram(before,after,cmd,caption='Git state transition') {return `<div class="diagram-section"><h3>${esc(caption)}</h3><div class="visual-row"><div class="visual-pane"><div class="visual-caption">BEFORE · TRƯỚC <small>INPUT / STATE</small></div>${before}</div><div class="visual-arrow"><span>⟶</span><small>${esc(cmd)}</small></div><div class="visual-pane after"><div class="visual-caption">AFTER · SAU <small>RESULT / STATE</small></div>${after}</div></div><div class="graph-legend"><span style="--c:${tones.purple}">Local / feature</span><span style="--c:${tones.blue}">Remote / target</span><span style="--c:${tones.mint}">Updated / result</span><span style="--c:${tones.orange}">Working changes</span></div></div>`}
function cmdCard(c){let risk=c.risk==='high'?'danger':c.risk==='medium'?'warn':'good';return `<article class="command-card" id="${c.id}" style="--tape:${({branch:'#A9D8F0',update:'#A9DEC4',stage:'#F9DA77',inspect:'#CFBAF6',utility:'#F5B6AF'})[c.group]}"><div class="cmd-heading"><div><h3><span class="cmd-id">${esc(c.id.split('-')[1])}</span> ${esc(c.title)}</h3><div class="reading">${badge(c.effect.toUpperCase())}${badge(c.risk.toUpperCase()+' RISK',risk)}</div></div><button data-copy="${esc(c.id)}" class="smallbtn">⧉ Copy</button></div><div class="cmd-line"><code>${esc(c.cmd)}</code></div><p class="cmd-description">${esc(c.purpose)}</p>${diagram(visual(c,'before'),visual(c,'after'),c.cmd,'Before → Command → After · Visual mental model')}<div class="diagram-note"><p><b>Trước:</b> ${esc(c.before)}</p><p><b>Sau:</b> ${esc(c.after)}</p></div><div class="card-bottom"><div class="example"><span class="label">REAL COMMAND EXAMPLE</span><code>${esc(c.example)}</code></div><div class="caution ${c.risk==='high'?'high':''}"><b>Lưu ý:</b> ${esc(c.note)}</div></div></article>`}
const mergeInfo={
basic:{title:'Basic merge (no fast-forward)',shape:'Non-linear · merge commit M',count:'Feature commits + M',sha:'Giữ F1, F2',desc:'Lịch sử của source branch được giữ lại và tạo merge commit với hai parents.'},
squash:{title:'Squash merge',shape:'Linear · 1 commit S',count:'Một commit S trên target',sha:'S là commit mới',desc:'Gom thay đổi F1 + F2 thành một commit S trên target. Commit F1 và F2 vẫn tồn tại trên source branch nếu branch được giữ.'},
rebaseff:{title:'Rebase and fast-forward',shape:'Linear · no merge commit',count:'F1′ + F2′',sha:'Commit IDs thay đổi',desc:'Replay F1 và F2 lên T2 thành F1′/F2′, rồi fast-forward target đến F2′.'},
rebasemerge:{title:'Rebase with merge commit',shape:'Semi-linear · merge M',count:'F1′ + F2′ + M',sha:'Replayed IDs thay đổi',desc:'Replay source commits lên target rồi tạo merge commit. Lịch sử có thêm marker hoàn tất PR.'}
};
function mergeGraph(which,phase){let before=`<path d="M40 96H123L224 52H319" fill="none" stroke="#95A7BB" stroke-width="3"/><path d="M123 96L224 145H319" fill="none" stroke="#95A7BB" stroke-width="3"/>${node(40,96,'A',tones.slate)}${node(123,96,'B',tones.slate)}${node(224,52,'T1',tones.blue)}${node(319,52,'T2',tones.blue)}${node(224,145,'F1',tones.purple)}${node(319,145,'F2',tones.purple)}${text(402,52,'main','#467EA8',12)}${text(407,145,'feature','#8668AE',12)}`;
if(phase==='before')return svg(before,'Before ADO PR merge');
if(which==='basic')return svg(before+`<path d="M319 52L420 96L319 145" stroke="#7FBAA4" stroke-width="3" fill="none"/>${node(420,96,'M',tones.mint)}${text(421,132,'main → M','#267D64',12)}`,'Basic merge after');
if(which==='squash')return svg(`<path d="M35 68H398" stroke="#93A7BD" stroke-width="3"/>${node(35,68,'A',tones.slate)}${node(122,68,'B',tones.slate)}${node(210,68,'T1',tones.blue)}${node(299,68,'T2',tones.blue)}${node(399,68,'S',tones.mint)}<path d="M122 68L210 145H299" stroke="#A69FC0" stroke-width="2" stroke-dasharray="5 4" fill="none"/>${node(210,145,'F1',tones.purple)}${node(299,145,'F2',tones.purple)}${text(403,40,'main → S','#227D60',12)}${text(400,149,'source unchanged','#8968A7',11)}`,'Squash after');
if(which==='rebaseff')return svg(`<path d="M35 93H431" stroke="#94A8BC" stroke-width="3"/>${node(35,93,'A',tones.slate)}${node(109,93,'B',tones.slate)}${node(181,93,'T1',tones.blue)}${node(252,93,'T2',tones.blue)}${node(337,93,'F1′',tones.purple)}${node(431,93,'F2′',tones.mint)}${text(421,56,'main → F2′','#2A866C',12)}${text(255,145,'new commit SHA','#8674AE',12)}`,'Rebase fast-forward after');
return svg(`<path d="M37 127H119H200H282L354 57H413L445 127H282" stroke="#92A9BF" stroke-width="3" fill="none"/>${node(37,127,'A',tones.slate)}${node(119,127,'B',tones.slate)}${node(200,127,'T1',tones.blue)}${node(282,127,'T2',tones.blue)}${node(354,57,'F1′',tones.purple)}${node(413,57,'F2′',tones.purple)}${node(445,127,'M',tones.mint)}${text(424,160,'main → M','#277B65',11)}`,'Rebase merge after')}
function mergeSection(){let d=mergeInfo[strategy];return `${header('ADO Pull Request · Merge strategies','Chọn kiểu merge để xem commit graph thay đổi ngay trước và sau khi Complete PR.')}<div class="flow-banner"><strong>ADO branch policy trong screenshot:</strong> Chỉ bật <b>Squash merge</b>. Policy này áp dụng lúc complete PR, khác với <code>git pull --ff-only</code> trên local.</div><div class="strategy-tabs">${Object.entries(mergeInfo).map(([id,v])=>`<button class="strategy-tab ${strategy===id?'active':''}" data-strategy="${id}">${esc(v.title)}</button>`).join('')}</div><div id="strategyContent">${diagram(mergeGraph(strategy,'before'),mergeGraph(strategy,'after'),d.title,'Commit graph · 2 divergent branches → ADO PR completion')}<div class="outcomes"><div class="outcome"><span>STRATEGY</span><strong>${esc(d.title)}</strong></div><div class="outcome"><span>HISTORY SHAPE</span><strong>${esc(d.shape)}</strong></div><div class="outcome"><span>COMMITS ON TARGET</span><strong>${esc(d.count)}</strong></div><div class="outcome"><span>COMMIT SHA</span><strong>${esc(d.sha)}</strong></div></div><div class="explain"><strong>Ý nghĩa:</strong><p>${esc(d.desc)}</p></div></div><div class="section" style="margin-top:22px"><div class="section-top"><div><span class="eyebrow">COMPARE ALL</span><h2>So sánh 4 phương án</h2></div></div><div class="table-scroll"><table class="compare"><thead><tr><th>Merge strategy</th><th>Target history</th><th>Original feature commits</th><th>Extra merge commit</th></tr></thead><tbody><tr><td>Basic merge</td><td>Non-linear</td><td>Preserved</td><td>Yes</td></tr><tr><td>Squash merge</td><td>Linear</td><td>One new commit replaces them on target</td><td>No</td></tr><tr><td>Rebase and fast-forward</td><td>Linear</td><td>Replayed with new hashes</td><td>No</td></tr><tr><td>Rebase with merge commit</td><td>Semi-linear</td><td>Replayed with new hashes</td><td>Yes</td></tr></tbody></table></div></div>`}
function fullPolicy(){const img=JSON.parse(document.getElementById('adoShot').textContent);return header('Branch policy · Limit merge types','Ảnh Azure DevOps bạn cung cấp và cách đọc chính xác.')+`<div class="card"><div class="policy-title"><h3 style="margin:0">Allowed merge types</h3>${badge('ON','good')}${badge('SQUASH ONLY','info')}</div><p style="color:#667b94">Azure DevOps đang bật <b>Limit merge types</b>, nhưng chỉ checkbox <b>Squash merge</b> được chọn. Kết quả là pull request vào branch áp dụng policy sẽ được hoàn tất theo kiểu Squash, không phải rebase/merge commit.</p><img class="screen" src="${img}" alt="Azure DevOps allowed merge types screenshot"></div><div class="section"><button data-view="merge" class="smallbtn primary">See merge graphs →</button></div>`}
function groupView(id){const g=G.find(x=>x.id===id),cs=C.filter(x=>x.group===id);return header(sectionNames[id],`${cs.length} commands · Flow trước/sau, ví dụ CLI và lưu ý.`)+`<div class="command-links">${cs.map(c=>`<button class="jump" data-jump="${c.id}">${c.id.split('-')[1]} · ${esc(c.title)}</button>`).join('')}</div>`+cs.map(cmdCard).join('')}
function oneCommand(c){return header(c.title,'Visualize commit history, refs, staging index hoặc working tree trước/sau command.')+`<div class="reading mb"><button data-view="group-${c.group}" class="back">← ${esc(sectionNames[c.group])}</button></div>`+cmdCard(c)}
function guideIndex(){return hero('Git Commands & Commit History','Tài liệu tham khảo trực quan cho Git và Azure DevOps: mỗi command có graph Before → After riêng, ví dụ thực tế, output và cảnh báo khi có thể gây conflict.')+`<div class="feature"><span class="feature-icon">📚</span><div><b>Học bằng commit graphs thay vì chỉ đọc command syntax</b><p>Chọn một nhóm, mở command và so sánh commit history / refs / working tree trước-sau.</p></div><button class="smallbtn" data-view="merge">Open merge graphs →</button></div><div class="stats"><div class="stat"><span>Git commands</span><b>45</b><small>5 nhóm theo workflow</small></div><div class="stat"><span>ADO merge strategies</span><b>4</b><small>Before / After commit graphs</small></div><div class="stat"><span>Visual states</span><b>90+</b><small>Before + After per command</small></div><div class="stat"><span>Search</span><b>Global</b><small>Ctrl + K</small></div></div><section class="section"><div class="section-top"><div><span class="eyebrow">LEARNING LIBRARY</span><h2>Chọn nội dung muốn học</h2><p>Sidebar có phân cấp; các cards dưới đây dẫn đến phần chi tiết.</p></div></div><div class="learning-grid">${G.map((g,i)=>`<button class="lesson-card" data-view="group-${g.id}" style="--tape:${['#A9D8F0','#A9DEC4','#F9DA77','#CFBAF6','#F5B6AF'][i]}"><div class="head"><span class="art">${navIcon(g.id,20)}</span><span class="count">${C.filter(x=>x.group===g.id).length} CMD</span></div><strong>${esc(sectionNames[g.id])}</strong><p>${esc(g.sub)} · ví dụ và commit / file flows.</p><div class="foot"><span>BEFORE → AFTER</span><em>↗</em></div></button>`).join('')}<button class="lesson-card" data-view="merge" style="--tape:#A9DEC4"><div class="head"><span class="art">⑂</span><span class="count">4 TYPES</span></div><strong>Azure DevOps PR merge strategies</strong><p>Basic · Squash · Rebase fast-forward · Rebase merge commit</p><div class="foot"><span>COMMIT GRAPHS</span><em>↗</em></div></button></div></section><section class="section"><div class="section-top"><div><span class="eyebrow">MENTAL MODEL</span><h2>Git remote → local → files</h2><p>Ref remote không phải file working tree.</p></div></div>${diagram(flowGraph('before','clone','Git remote'),flowGraph('after','clone','Git remote'),'git clone','Lấy remote objects và refs về local')}<div class="callouts"><div class="card"><strong>Fetch ≠ Pull</strong><p><code>git fetch</code> cập nhật remote-tracking refs; <code>git pull</code> còn tích hợp commit vào local branch.</p></div><div class="card"><strong>ADO PR merge ≠ local pull</strong><p>Policy giới hạn các kiểu complete PR; nó không tự đổi cách local <code>git pull</code> hoạt động.</p></div></div></section>`}
function workflow(){return header('Git workflow · Before → After','Đi từ ADO remote đến local repo, staging, commit và push.')+`<div class="feature"><span class="feature-icon">⑃</span><div><b>Recommended daily workflow</b><p>Fetch → inspect → fast-forward → edit → stage → commit → push.</p></div></div>`+[10,13,20,22,23].map(id=>cmdCard(C.find(c=>Number(c.id.split('-')[1])===id))).join('')}
function conflicts(){return header('Fast-forward · local changes · conflicts','Phân biệt history divergence với uncommitted working-tree changes.')+`<div class="flow-banner"><strong>Fast-forward:</strong> Local HEAD là ancestor của remote target. Git di chuyển branch pointer, không tạo merge commit. Uncommitted local changes vẫn có thể cản trở update nếu bị ghi đè.</div>${diagram(history('before','ff'),history('after','ff'),'git pull --ff-only origin main','Case A · Linear history, no new merge commit')}<div class="callouts"><div class="card"><strong>Local sửa file không bị remote đụng tới</strong><p>Git có thể giữ local changes và hoàn tất fast-forward. Không có conflict không có nghĩa local changes đã biến mất.</p></div><div class="card"><strong>Remote cần ghi đè local edit</strong><p>Git thường abort và yêu cầu commit/stash thay đổi. Đây là bảo vệ working tree, khác với merge conflict giữa các commits.</p></div></div><div class="section"><h2 style="color:#2D4268">Case B · Diverged commits</h2><p class="strategy-summary">Khi local/remote có commits riêng, <code>--ff-only</code> sẽ từ chối; merge hoặc rebase có thể phát sinh conflicts.</p>${diagram(diverge('before','merge'),diverge('after','merge'),'git merge','Diverged branches → merge commit (nếu merge thành công)')}</div>`}
function searchView(){let q=query.toLowerCase().trim(),arr=C.filter(c=>[c.cmd,c.title,c.purpose,c.note,c.before,c.after,c.example,sectionNames[c.group]].join(' ').toLowerCase().includes(q));let merges=Object.entries(mergeInfo).filter(([id,m])=>(m.title+' '+m.desc).toLowerCase().includes(q));return header('Search Git handbook',`Search: “${query}” · ${arr.length} commands · ${merges.length} merge types`)+(merges.length?`<h2 class="search-result-heading">Merge strategies</h2>${merges.map(([id,m])=>`<button class="search-card" data-open-strategy="${id}"><span>${esc(m.title)}</span><span>↗</span></button>`).join('')}`:'')+(arr.length?`<h2 class="search-result-heading">Git commands</h2>${arr.map(c=>`<button class="search-card" data-view="command-${c.id}"><span><strong>${esc(c.title)}</strong><span class="code">${esc(c.cmd)}</span></span><span>↗</span></button>`).join('')}`:'<div class="empty">Không có command phù hợp.</div>')}
function render(){buildNav();let view=current;if(query.trim())view='search';if(view==='home')P.innerHTML=guideIndex();else if(view==='merge')P.innerHTML=mergeSection();else if(view==='policy')P.innerHTML=fullPolicy();else if(view==='workflow')P.innerHTML=workflow();else if(view==='conflict')P.innerHTML=conflicts();else if(view==='search')P.innerHTML=searchView();else if(view.startsWith('group-'))P.innerHTML=groupView(view.slice(6));else if(view.startsWith('command-')){let c=C.find(x=>x.id===view.slice(8));P.innerHTML=c?oneCommand(c):guideIndex()}else P.innerHTML=guideIndex();document.getElementById('shell').classList.add('ready');}
function go(id){current=id;query='';search.value='';if(id.startsWith('group-'))expanded.add(id.slice(6));if(id.startsWith('command-')){const c=C.find(x=>x.id===id.slice(8));if(c)expanded.add(c.group)}render();window.scrollTo({top:0,behavior:'instant'});closeSide()}
function closeSide(){side.classList.remove('open');document.getElementById('backdrop').classList.remove('open')}
function notify(s){let el=document.getElementById('toast');el.textContent=s;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1700)}
function copy(s){if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>notify('✓ Copied')).catch(()=>fallback())}else fallback();function fallback(){let a=document.createElement('textarea');a.value=s;document.body.appendChild(a);a.select();try{document.execCommand('copy');notify('✓ Copied')}catch(e){notify('Select the command and copy manually')}a.remove()}}
document.addEventListener('click',e=>{let b=e.target.closest('[data-toggle]');if(b){let id=b.dataset.toggle;if(expanded.has(id))expanded.delete(id);else expanded.add(id);buildNav();return}b=e.target.closest('[data-view]');if(b){go(b.dataset.view);return}b=e.target.closest('[data-jump]');if(b){document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth',block:'start'});return}b=e.target.closest('[data-strategy]');if(b){strategy=b.dataset.strategy;render();return}b=e.target.closest('[data-open-strategy]');if(b){strategy=b.dataset.openStrategy;go('merge');return}b=e.target.closest('[data-copy]');if(b){let c=C.find(x=>x.id===b.dataset.copy);if(c)copy(c.example);return}});
search.addEventListener('input',e=>{query=e.target.value;render()});document.getElementById('resetSearch').onclick=()=>{search.value='';query='';render()};document.getElementById('expandNav').onclick=()=>{if(expanded.size>=7)expanded.clear();else ['intro','merge',...G.map(x=>x.id)].forEach(x=>expanded.add(x));buildNav()};document.getElementById('mobileMenu').onclick=()=>{side.classList.add('open');document.getElementById('backdrop').classList.add('open')};document.getElementById('backdrop').onclick=closeSide;document.getElementById('print').onclick=()=>window.print();document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();search.focus()}if(e.key==='Escape')closeSide()});render();
})();
</script></body></html>
